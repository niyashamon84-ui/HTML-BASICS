<html>
    <head><title>FORM</title></head>
    <body>
        <form >
            <caption> <strong>REGISTRATION FORM</strong></caption>
            <br> <br>
            <label >Name</label>
            <input type="text" placeholder="Enter your name">
            <br>   <br>

            <label >Address</label>
            <textarea ></textarea>
            <br> <br>

            <label >Password</label>
            <input type="password" required>
            <br>  <br>

            <label >E-mail</label>
            <input type="email" value="abc123@gmail.com" disabled>
            <br>   <br>

            <label >Contact No.</label>
            <input type="number">
            <br>   <br>

            <label>Gender:</label>
            <input type="radio" name="gender" >
            <label>Male</label>
            <input type="radio" name="gender" >
            <label>Female</label>
            <input type="radio" name="gender" >
            <label>Others</label>
            <br> <br>

            <label>Hobbies</label>
            <input type="checkbox" name="hobby" >
            <label>Reading</label>
            <input type="checkbox" name="hobby">
            <label>Gaming</label>
            <input type="checkbox" name="hobby">
            <label>Crochet</label>
            <br>  <br>

            <label >Date</label>
            <input type="date">
            <br> <br>

            <label >Country </label>
            <select >
                <option >India</option>
                <option >Pakistan</option>
                <option >America</option>
                <option >Germany</option>
            </select>
            <br>  <br>

            <label >File Upload</label>
            <input type="file">
            <br> <br>
            
            <button>Submit</button>
        </form>
    </body>
</html>
