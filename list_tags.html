<!DOCTYPE html>
<html>
<head>
    <title>List Tags</title>
</head>

<body>

    <!-- Unordered List -->
    <h3>Unordered List</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- Ordered List -->
    <h3>Ordered List</h3>
    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
    </ol>

    <!-- Description List -->
    <h3>Description List</h3>
    <dl>
        <dt>HTML</dt>
        <dd>HTML is used to create the structure of a webpage.</dd>

        <dt>CSS</dt>
        <dd>CSS is used to style a webpage.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript is used to add functionality to a webpage.</dd>
    </dl>

    <hr>

</body>
</html>
