<!DOCTYPE html>
<html>
<head>
    <title>Media Tag</title>
</head>

<body>

    <!-- Link -->
    <a href="https://www.wikipedia.org/">Wikipedia</a>

    <br><br>

    <!-- Image -->
    <img src="https://tse1.mm.bing.net/th/id/OIP.0JbZkj5mDd4eiI6qAkUebQHaE8?r=0&pid=Api&P=0&h=180" 
         alt="Landscape" 
         width="300">
    <p>Landscape</p>

    <!-- Audio -->
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <br><br>

    <!-- Video -->
    <video controls width="300">
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <br><br>

    <!-- Iframe -->
    <iframe src="https://www.wikipedia.org/" 
            width="500" 
            height="300">
    </iframe>

</body>
</html>
